
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradelix Mining Deployment</title>
<style>
body{background:#080d18;color:white;font-family:Arial;padding:20px}
main{max-width:700px;margin:auto}
.card{background:#111a2b;padding:20px;border-radius:14px}
h2{color:#e9bd55}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;border-radius:8px}
input{background:#080d18;color:white;border:1px solid #41516d}
button{background:#d9aa3f;color:#111;font-weight:bold;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#f4d98c}
</style>
</head>
<body>
<main>
<h2>TRADELIX AI MINING DEPLOYMENT</h2>
<div class="card">
<p>BNB Smart Chain — Daily Rate: 1% — Maximum Rewards: 30,000,000 TLX</p>

<label>TLX Token Address</label>
<input id="token" value="0x252345178fb4E2b5724B96756c47Da89b618CD30">

<label>Sale Contract Address</label>
<input id="sale" value="0x95969e4888A0afC7bb54c30F020a353407B35e0F">

<button id="connect">1. CONNECT TOKENPOCKET</button>
<button id="deploy" disabled>2. COMPILE &amp; DEPLOY MINING</button>
<div id="status">Not connected</div>
</div>
</main>

<script>
const status = document.getElementById("status");
const connectButton = document.getElementById("connect");
const deployButton = document.getElementById("deploy");

let connectedAccount = null;

const source = `
// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

interface IERC20TLX {
    function balanceOf(address account) external view returns (uint256);
    function transfer(address to, uint256 amount) external returns (bool);
}

interface ITradelixSaleData {
    function firstPurchaseTokens(address user) external view returns (uint256);
    function firstPurchaseTime(address user) external view returns (uint256);
}

library FullMath {
    function mulDiv(uint256 a,uint256 b,uint256 denominator)
        internal pure returns (uint256 result)
    {
        unchecked {
            uint256 prod0;
            uint256 prod1;
            assembly {
                let mm := mulmod(a,b,not(0))
                prod0 := mul(a,b)
                prod1 := sub(sub(mm,prod0),lt(mm,prod0))
            }
            if (prod1 == 0) return prod0 / denominator;
            require(denominator > prod1,"Math overflow");
            uint256 remainder;
            assembly {
                remainder := mulmod(a,b,denominator)
                prod1 := sub(prod1,gt(remainder,prod0))
                prod0 := sub(prod0,remainder)
            }
            uint256 twos = denominator & (~denominator + 1);
            assembly {
                denominator := div(denominator,twos)
                prod0 := div(prod0,twos)
                twos := add(div(sub(0,twos),twos),1)
            }
            prod0 |= prod1 * twos;
            uint256 inverse = (3 * denominator) ^ 2;
            inverse *= 2 - denominator * inverse;
            inverse *= 2 - denominator * inverse;
            inverse *= 2 - denominator * inverse;
            inverse *= 2 - denominator * inverse;
            inverse *= 2 - denominator * inverse;
            inverse *= 2 - denominator * inverse;
            result = prod0 * inverse;
        }
    }
}

contract TradelixMining {
    address public owner;
    IERC20TLX public immutable tlxToken;
    ITradelixSaleData public immutable saleContract;

    mapping(address => uint256) public lastClaimTime;

    uint256 public constant DAILY_RATE = 100;
    uint256 public constant RATE_DENOMINATOR = 10000;
    uint256 public constant DAY = 1 days;
    uint256 public constant MAX_REWARDS = 30_000_000 * 10**18;

    uint256 public totalRewardsPaid;
    uint256 private locked = 1;

    event MiningClaimed(address indexed user,uint256 amount,uint256 timestamp);
    event OwnershipTransferred(address indexed previousOwner,address indexed newOwner);

    modifier onlyOwner() {
        require(msg.sender == owner,"Not owner");
        _;
    }

    modifier nonReentrant() {
        require(locked == 1,"Reentrant call");
        locked = 2;
        _;
        locked = 1;
    }

    constructor(address tokenAddress,address saleAddress) {
        require(tokenAddress != address(0),"Invalid token");
        require(saleAddress != address(0),"Invalid sale");
        owner = msg.sender;
        tlxToken = IERC20TLX(tokenAddress);
        saleContract = ITradelixSaleData(saleAddress);
        emit OwnershipTransferred(address(0),msg.sender);
    }

    function claim() external nonReentrant {
        uint256 baseAmount = saleContract.firstPurchaseTokens(msg.sender);
        uint256 purchaseTime = saleContract.firstPurchaseTime(msg.sender);

        require(baseAmount > 0,"No eligible first purchase");
        require(purchaseTime > 0,"Purchase not recorded");

        uint256 previousClaim = lastClaimTime[msg.sender];
        if (previousClaim == 0) previousClaim = purchaseTime;

        require(block.timestamp >= previousClaim + DAY,"Wait 24 hours");

        uint256 elapsed = block.timestamp - previousClaim;
        uint256 reward = FullMath.mulDiv(
            baseAmount,
            DAILY_RATE * elapsed,
            RATE_DENOMINATOR * DAY
        );

        require(reward > 0,"Reward too small");
        require(totalRewardsPaid + reward <= MAX_REWARDS,"Mining allocation exhausted");
        require(tlxToken.balanceOf(address(this)) >= reward,"Mining reserve insufficient");

        lastClaimTime[msg.sender] = block.timestamp;
        totalRewardsPaid += reward;

        require(tlxToken.transfer(msg.sender,reward),"TLX transfer failed");

        emit MiningClaimed(msg.sender,reward,block.timestamp);
    }

    function miningReserveBalance() external view returns (uint256) {
        return tlxToken.balanceOf(address(this));
    }

    function remainingRewards() external view returns (uint256) {
        return MAX_REWARDS - totalRewardsPaid;
    }

    function transferOwnership(address newOwner) external onlyOwner {
        require(newOwner != address(0),"Invalid owner");
        emit OwnershipTransferred(owner,newOwner);
        owner = newOwner;
    }
}
`;

function showError(error) {
    return error?.shortMessage || error?.reason || error?.message || String(error);
}

async function switchToBNBChain() {
    await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x38" }]
    });

    const chainId = await window.ethereum.request({
        method: "eth_chainId"
    });

    if (chainId.toLowerCase() !== "0x38") {
        throw new Error("Please select BNB Smart Chain.");
    }
}

connectButton.addEventListener("click", async () => {
    connectButton.disabled = true;
    deployButton.disabled = true;

    try {
        if (!window.ethereum) {
            throw new Error("Open this page inside TokenPocket DApp browser.");
        }

        status.textContent = "Connecting to TokenPocket...";

        const accounts = await window.ethereum.request({
            method: "eth_requestAccounts"
        });

        if (!accounts || accounts.length === 0) {
            throw new Error("No wallet account selected.");
        }

        await switchToBNBChain();

        const currentAccounts = await window.ethereum.request({
            method: "eth_accounts"
        });

        if (!currentAccounts || currentAccounts.length === 0) {
            throw new Error("Wallet account is not available.");
        }

        connectedAccount = currentAccounts[0];

        status.textContent =
            "Connected: " + connectedAccount +
            "\nBNB Smart Chain connected.";

        deployButton.disabled = false;

    } catch (error) {
        connectedAccount = null;
        status.textContent = "Connection error: " + showError(error);
    } finally {
        connectButton.disabled = false;
    }
});

if (window.ethereum && window.ethereum.on) {
    window.ethereum.on("accountsChanged", (accounts) => {
        connectedAccount = null;
        deployButton.disabled = true;

        if (accounts && accounts.length > 0) {
            status.textContent =
                "Wallet account changed.\nPlease connect again.";
        } else {
            status.textContent = "Wallet disconnected.";
        }
    });

    window.ethereum.on("chainChanged", () => {
        connectedAccount = null;
        deployButton.disabled = true;
        status.textContent =
            "Network changed.\nPlease connect again to BNB Smart Chain.";
    });
}

deployButton.addEventListener("click", async () => {
    deployButton.disabled = true;

    try {
        if (!window.ethereum) {
            throw new Error("TokenPocket wallet not detected.");
        }

        if (!connectedAccount) {
            throw new Error("Connect TokenPocket first.");
        }

        const token = document.getElementById("token").value.trim();
        const sale = document.getElementById("sale").value.trim();

        status.textContent = "Checking wallet and network...";

        const accounts = await window.ethereum.request({
            method: "eth_accounts"
        });

        if (!accounts || accounts.length === 0 ||
            accounts[0].toLowerCase() !== connectedAccount.toLowerCase()) {
            throw new Error("Wallet account changed. Connect again.");
        }

        const chainId = await window.ethereum.request({
            method: "eth_chainId"
        });

        if (chainId.toLowerCase() !== "0x38") {
            throw new Error("Wrong network. Select BNB Smart Chain.");
        }

        status.textContent = "Loading deployment libraries...";

        const ethersModule = await import(
            "https://esm.sh/ethers@6.13.5"
        );

        const solcModule = await import(
            "https://esm.sh/solc@0.8.20"
        );

        const ethers = ethersModule.ethers || ethersModule;
        const solc = solcModule.default || solcModule;

        if (!ethers || !solc || typeof solc.compile !== "function") {
            throw new Error("Could not load deployment libraries.");
        }

        if (!ethers.isAddress(token) || !ethers.isAddress(sale)) {
            throw new Error("Invalid contract address.");
        }

        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();

        const signerAddress = await signer.getAddress();

        if (signerAddress.toLowerCase() !== connectedAccount.toLowerCase()) {
            throw new Error("Wallet account changed. Connect again.");
        }

        const network = await provider.getNetwork();

        if (network.chainId !== 56n) {
            throw new Error("Wrong network.");
        }

        status.textContent = "Compiling mining contract...";

        const input = {
            language: "Solidity",
            sources: {
                "TradelixMining.sol": { content: source }
            },
            settings: {
                optimizer: { enabled: true, runs: 200 },
                outputSelection: {
                    "*": {
                        "*": ["abi", "evm.bytecode.object"]
                    }
                }
            }
        };

        const output = JSON.parse(solc.compile(JSON.stringify(input)));

        const errors = (output.errors || []).filter(
            error => error.severity === "error"
        );

        if (errors.length) {
            throw new Error(
                errors.map(error => error.formattedMessage).join("\n")
            );
        }

        const data =
            output.contracts["TradelixMining.sol"].TradelixMining;

        if (!data.evm.bytecode.object) {
            throw new Error("Contract bytecode was not generated.");
        }

        const factory = new ethers.ContractFactory(
            data.abi,
            "0x" + data.evm.bytecode.object,
            signer
        );

        status.textContent =
            "Review the deployment details and confirm only if correct." +
            "\nToken: " + token +
            "\nSale: " + sale +
            "\nNetwork: BNB Smart Chain";

        const contract = await factory.deploy(token, sale);

        const tx = contract.deploymentTransaction();

        status.textContent =
            "Deployment transaction submitted:\n" + tx.hash +
            "\nWaiting for confirmation...";

        await contract.waitForDeployment();

        const deployedAddress = await contract.getAddress();

        status.textContent =
            "DEPLOYED SUCCESSFULLY\n" +
            "Contract: " + deployedAddress +
            "\nTransaction: " + tx.hash +
            "\n\nThe contract is NOT funded yet." +
            "\nVerify the contract address and settings before transferring any TLX.";

    } catch (error) {
        status.textContent = "Stopped: " + showError(error);
        deployButton.disabled = !connectedAccount;
    }
});
</script>
</body>
</html>
